appId: com.summerbreeze.gui
productName: Summer Breeze
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: ..
    to: summer-breeze-root
    filter:
      - summerbreeze.py
      - gui/bridge.py
      - sc64deployer*
      - roms/**
      - menu_versions/**
      - menu_music/**
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
  executableName: SummerBreeze
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: exusxt
  repo: Summer-Breeze-GUI
  releaseType: release
