appId: com.summerbreeze.gui
productName: Summer Breeze GUI
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: ..
    to: summer-breeze-root
    filter:
      - summerbreeze.py
      - gui/bridge.py
      - sc64deployer*
      - roms/**
      - menu_versions/**
      - menu_music/**
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64
  icon: build/icon.png
  executableName: SummerBreezeGUI
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Summer-Breeze-GUI-Setup-${version}.${ext}
portable:
  artifactName: Summer-Breeze-GUI-${version}.${ext}
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  # Space-free install dir (/opt/summer-breeze-gui): Chromium's SUID sandbox
  # cannot run from a path containing spaces.
  executableName: summer-breeze-gui
  icon: build/icon.png
  desktop:
    Name: Summer Breeze GUI
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
    - target: pacman
      arch:
        - x64
        - arm64
  category: Utility
  maintainer: exusxt
  synopsis: Manage ROMs on your SummerCart64 flash cart
npmRebuild: false
publish:
  provider: github
  owner: exusxt
  repo: Summer-Breeze-GUI
  releaseType: release
